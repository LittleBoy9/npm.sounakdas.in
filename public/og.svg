<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cb3837;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#cb3837;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#glow)"/>

  <!-- Dot grid -->
  <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.5" fill="rgba(255,255,255,0.04)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- npm badge -->
  <rect x="80" y="80" width="90" height="40" rx="10" fill="#cb3837"/>
  <text x="125" y="107" text-anchor="middle" font-family="monospace" font-weight="700" font-size="18" fill="#ffffff" letter-spacing="-0.5">npm</text>

  <!-- Main heading -->
  <text x="80" y="230" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="72" fill="#f8fafc" letter-spacing="-2">npm.sounakdas.in</text>

  <!-- Subtitle -->
  <text x="80" y="300" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="28" fill="#94a3b8">Public npm packages by Sounak Das</text>

  <!-- Divider -->
  <rect x="80" y="348" width="120" height="3" rx="2" fill="#cb3837"/>

  <!-- Tags -->
  <rect x="80" y="390" width="160" height="40" rx="20" fill="rgba(203,56,55,0.15)" stroke="rgba(203,56,55,0.3)" stroke-width="1"/>
  <text x="160" y="416" text-anchor="middle" font-family="monospace" font-size="16" fill="#cb3837">TypeScript</text>

  <rect x="256" y="390" width="120" height="40" rx="20" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="316" y="416" text-anchor="middle" font-family="monospace" font-size="16" fill="#94a3b8">React</text>

  <rect x="392" y="390" width="120" height="40" rx="20" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="452" y="416" text-anchor="middle" font-family="monospace" font-size="16" fill="#94a3b8">Node.js</text>

  <rect x="528" y="390" width="100" height="40" rx="20" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="578" y="416" text-anchor="middle" font-family="monospace" font-size="16" fill="#94a3b8">CLI</text>

  <!-- Terminal command -->
  <rect x="80" y="480" width="420" height="60" rx="14" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="108" y="517" font-family="monospace" font-size="18" fill="#f87171">$</text>
  <text x="132" y="517" font-family="monospace" font-size="18" fill="#f8fafc">npm i sounakdas</text>

  <!-- Right side — package count card -->
  <rect x="860" y="200" width="260" height="140" rx="20" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text id="pkg-count" x="980" y="256" text-anchor="middle" font-family="monospace" font-weight="700" font-size="52" fill="#f8fafc">11</text>
  <text x="980" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" letter-spacing="2">PACKAGES PUBLISHED</text>

  <!-- MIT badge bottom right -->
  <text x="1120" y="570" text-anchor="end" font-family="monospace" font-size="14" fill="#475569">MIT Licensed · Open Source</text>
</svg>
