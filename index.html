<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Everything between the seo-head markers is regenerated per route by
      scripts/prerender.js at build time. Do not hand-edit — change src/seo/meta.ts.
      The tags below are the dev-server fallback for "/".
    -->
    <!--seo-head-->
    <title>Sounak Das · npm Packages &amp; Developer Tools</title>
    <meta name="description" content="Open source npm packages by Sounak Das — CLI tools, React libraries, Node.js utilities, and TypeScript packages. MIT licensed, zero-dependency." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://npm.sounakdas.in/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="npm.sounakdas.in" />
    <meta property="og:url" content="https://npm.sounakdas.in/" />
    <meta property="og:title" content="Sounak Das · npm Packages &amp; Developer Tools" />
    <meta property="og:description" content="Open source npm packages by Sounak Das — CLI tools, React libraries, Node.js utilities, and TypeScript packages. MIT licensed, zero-dependency." />
    <meta property="og:image" content="https://npm.sounakdas.in/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="npm.sounakdas.in — Open source packages by Sounak Das" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sounak Das · npm Packages &amp; Developer Tools" />
    <meta name="twitter:description" content="Open source npm packages by Sounak Das — CLI tools, React libraries, Node.js utilities, and TypeScript packages." />
    <meta name="twitter:image" content="https://npm.sounakdas.in/og.png" />
    <meta name="twitter:image:alt" content="npm.sounakdas.in — Open source packages by Sounak Das" />
    <!--/seo-head-->

    <meta name="author" content="Sounak Das" />
    <meta name="theme-color" content="#cb3837" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts — loaded non-render-blocking, swapped in on load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
